name: Deploy To GAE On Merge To Develop

on:
  push:
    branches:
      - develop

jobs:
  dev_deploy:
    name: 'Deploy To Google Cloud'
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - id: checkout
        name: Checkout Repo
        uses: actions/checkout@v4

      - id: setupNode
        name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - id: install
        name: Install Dependencies
        run: npm ci

      - id: build
        name: Build Artifacts
        run: npm run build:ts

      - id: storeDist
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist

      - id: checkSecrets
        name: Verify GCP Deployment Secrets
        run: |
          if [ -z "${{ secrets.DEV_STG_WORKLOAD_IDENTITY_PROVIDER }}" ] || [ -z "${{ secrets.DEV_STG_WIP_SA }}" ]; then
            echo "⚠️ GCP Workload Identity secrets (DEV_STG_WORKLOAD_IDENTITY_PROVIDER / DEV_STG_WIP_SA) are not configured in GitHub repository secrets."
            echo "ℹ️ Skipping cloud deployment step until secrets are added in GitHub Settings -> Secrets -> Actions."
            echo "DEPLOY_ENABLED=false" >> $GITHUB_ENV
          else
            echo "✅ GCP Workload Identity secrets found."
            echo "DEPLOY_ENABLED=true" >> $GITHUB_ENV
          fi

      - id: auth
        if: env.DEPLOY_ENABLED == 'true'
        name: Authenticate To Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.DEV_STG_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.DEV_STG_WIP_SA }}

      - id: deploy
        if: env.DEPLOY_ENABLED == 'true'
        name: Deploy To Google Cloud App Engine
        uses: google-github-actions/deploy-appengine@v2
        with:
          deliverables: './app.yml'
          env_vars: |-
            DB_NAME=${{ secrets.DEV_STG_DB_NAME }}
            DB_PASS=${{ secrets.DEV_STG_DB_PASS }}
            DB_USER=${{ secrets.DEV_STG_DB_USER }}
            DB_HOST=${{ secrets.DEV_STG_DB_HOST }}

      - id: smokeTest
        if: env.DEPLOY_ENABLED == 'true'
        name: Smoke Test Deployed URL
        run: 'curl -f "${{ steps.deploy.outputs.url }}"'
