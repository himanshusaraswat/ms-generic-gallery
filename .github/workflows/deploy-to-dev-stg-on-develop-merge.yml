name: Deploy To Cloud Run On Merge To Develop

on:
  workflow_dispatch:
  push:
    branches:
      - develop

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    name: 'CI Quality Verification (Lint, Typecheck, Test, Build)'
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout Repo
        uses: actions/checkout@v4

      - id: setupNode
        name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - id: install
        name: Install Dependencies
        run: npm ci

      - id: lint
        name: Run ESLint
        run: npm run lint

      - id: format
        name: Check Code Formatting
        run: npm run format:check

      - id: typecheck
        name: Run TypeScript Compilation Check
        run: npm run typecheck

      - id: test
        name: Run Automated Unit Tests
        run: npm test

      - id: build
        name: Build Artifacts
        run: npm run build:ts

      - id: storeDist
        name: Store Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist

  dev_deploy:
    name: 'Deploy To Google Cloud'
    runs-on: ubuntu-latest
    needs: [ci] # 🔒 Hard Gate: CD NEVER runs if CI fails or is cancelled
    steps:
      - id: checkout
        name: Checkout Repo
        uses: actions/checkout@v4

      - id: downloadDist
        name: Download Verified Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist

      - id: checkSecrets
        name: Verify GCP Deployment Secrets
        run: |
          if [ -z "${{ secrets.DEV_STG_WORKLOAD_IDENTITY_PROVIDER }}" ] || [ -z "${{ secrets.DEV_STG_WIP_SA }}" ]; then
            echo "⚠️ GCP Workload Identity secrets (DEV_STG_WORKLOAD_IDENTITY_PROVIDER / DEV_STG_WIP_SA) are not configured in GitHub repository secrets."
            echo "ℹ️ Skipping cloud deployment step until secrets are added in GitHub Settings -> Secrets -> Actions."
            echo "DEPLOY_ENABLED=false" >> $GITHUB_ENV
          else
            echo "✅ GCP Workload Identity secrets found."
            echo "DEPLOY_ENABLED=true" >> $GITHUB_ENV
          fi

      - id: auth
        if: env.DEPLOY_ENABLED == 'true'
        name: Authenticate To Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.DEV_STG_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.DEV_STG_WIP_SA }}

      - id: setupGcloud
        if: env.DEPLOY_ENABLED == 'true'
        name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - id: configureDocker
        if: env.DEPLOY_ENABLED == 'true'
        name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - id: buildAndPushDocker
        if: env.DEPLOY_ENABLED == 'true'
        name: Build and Push Docker Image
        run: |
          PROJECT_ID="${{ vars.GCP_PROJECT_ID || 'meraki-public' }}"
          REGION="${{ vars.GCP_REGION || 'us-central1' }}"
          REPO_NAME="ms-generic-gallery"
          IMAGE_TAG="us-central1-docker.pkg.dev/${PROJECT_ID}/apps/${REPO_NAME}:${{ github.sha }}"
          LATEST_TAG="us-central1-docker.pkg.dev/${PROJECT_ID}/apps/${REPO_NAME}:latest"

          docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" .
          docker push "$IMAGE_TAG"
          docker push "$LATEST_TAG"
          echo "DEPLOY_IMAGE=$IMAGE_TAG" >> $GITHUB_ENV

      - id: deployCloudRun
        if: env.DEPLOY_ENABLED == 'true'
        name: Deploy to Google Cloud Run (Scale to Zero)
        run: |
          gcloud run deploy ms-generic-gallery \
            --image "$DEPLOY_IMAGE" \
            --region us-central1 \
            --platform managed \
            --min-instances 0 \
            --max-instances 2 \
            --port 3000 \
            --cpu 1000m \
            --memory 512Mi \
            --set-env-vars "NODE_ENV=production,DB_NAME=${{ secrets.DEV_STG_DB_NAME }},DB_PASS=${{ secrets.DEV_STG_DB_PASS }},DB_USER=${{ secrets.DEV_STG_DB_USER }},DB_HOST=${{ secrets.DEV_STG_DB_HOST }}" \
            --allow-unauthenticated \
            --quiet
