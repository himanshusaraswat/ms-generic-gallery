name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  test:
    name: 'Execute TDD Test Suite'
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout Code
        uses: actions/checkout@v4

      - id: setupNode
        name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - id: install
        name: Install Dependencies
        run: npm ci

      - id: test
        name: Run Unit Tests
        run: npm test

      - id: build
        name: Compile TypeScript
        run: npm run build:ts
