name: CI

on:
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: 'Lint Commit Messages (Conventional Commits)'
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: setupNode
        name: Setup Node 26
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - id: commitlint
        name: Validate PR / Push Commits
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: 'commitlint.config.mjs'

  ci:
    name: 'CI Quality Gates (Lint, Typecheck, Test, Build)'
    runs-on: ubuntu-latest
    needs: [commitlint]
    steps:
      - id: checkout
        name: Checkout Code
        uses: actions/checkout@v4

      - id: setupNode
        name: Setup Node 26
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'

      - id: install
        name: Install Dependencies
        run: npm ci

      - id: lint
        name: Run ESLint
        run: npm run lint

      - id: format
        name: Check Code Formatting (Prettier)
        run: npm run format:check

      - id: typecheck
        name: Run TypeScript Compilation Check
        run: npm run typecheck

      - id: test
        name: Run Automated Unit Tests
        run: npm test

      - id: build
        name: Build TypeScript Artifacts
        run: npm run build:ts
